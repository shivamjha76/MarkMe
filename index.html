<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkMe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>Attendance System</h2>

  <!-- Editable Lecture Info -->
  <div class="inputs">
    <label><input type="date" id="attDate" value="2025-09-27"></label>
    <label><input type="text" id="attSubject" placeholder="Enter subject"></label>
    <label><input type="text" id="attTime" placeholder="e.g. 10:00 AM - 11:00 AM"></label>
  </div>

  <!-- Roll Number Grid -->
  <div class="grid" id="rollGrid"></div>

  <!-- Export Buttons -->
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="exportPDF()">Export PDF</button>

  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    // 🔹 Student Data
    const studentData = [
      { roll: 1, name: "Aarav Sharma", branch: "CSE" },
      { roll: 2, name: "Isha Verma", branch: "ECE" },
      { roll: 3, name: "Rohan Mehta", branch: "ME" },
      { roll: 4, name: "Sneha Patel", branch: "CSE" },
      { roll: 5, name: "Yash Gupta", branch: "EEE" },
      // Add more students as needed
    ];

    const totalStudents = 65;
    const attendance = [];
    const grid = document.getElementById("rollGrid");

    // 🔹 Create Roll Number Buttons
    for (let i = 1; i <= totalStudents; i++) {
      const btn = document.createElement("button");
      btn.innerText = i;
      btn.className = "roll-btn";
      btn.onclick = () => {
        btn.classList.toggle("present");
        if (attendance.includes(i)) {
          attendance.splice(attendance.indexOf(i), 1);
        } else {
          attendance.push(i);
        }
      };
      grid.appendChild(btn);
    }

    // 🔹 Export CSV
    function exportCSV() {
      const date = document.getElementById("attDate").value;
      const subject = document.getElementById("attSubject").value;
      const time = document.getElementById("attTime").value;

      let csv = `Date: ${date}\nSubject: ${subject}\nTime: ${time}\n\n`;
      csv += "Roll Number,Name,Branch\n";

      attendance.sort((a, b) => a - b).forEach(num => {
        const student = studentData.find(s => s.roll === num);
        if (student) {
          csv += `${student.roll},${student.name},${student.branch}\n`;
        } else {
          csv += `${num},Student ${num},Unknown\n`;
        }
      });

      const blob = new Blob([csv], { type: "text/csv" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `attendance_${date}.csv`;
      link.click();
    }

    // 🔹 Export PDF
    async function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const date = document.getElementById("attDate").value;
      const subject = document.getElementById("attSubject").value;
      const time = document.getElementById("attTime").value;

      doc.setFontSize(14);
      doc.text("Attendance Report", 20, 20);
      doc.setFontSize(10);
      doc.text(`Date: ${date}`, 20, 30);
      doc.text(`Subject: ${subject}`, 20, 36);
      doc.text(`Time: ${time}`, 20, 42);

      let y = 55;
      doc.text("Roll No   Name              Branch", 20, y);
      y += 10;

      attendance.sort((a, b) => a - b).forEach(num => {
        const student = studentData.find(s => s.roll === num);
        const name = student ? student.name : `Student ${num}`;
        const branch = student ? student.branch : "Unknown";
        doc.text(`${num}        ${name}     ${branch}`, 20, y);
        y += 8;
      });

      doc.save(`attendance_${date}.pdf`);
    }
  </script>
</body>
</html>
