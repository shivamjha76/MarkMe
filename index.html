<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkMe</title>
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <!----------------jsPDF + autoTable plugin -------------------------------->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>


<body>
  <div class="head">
  <img src="logo_jagan.png" alt="logo" class="logo">
  <h2>Attendance System</h2>
  </div>

  <!-------------------Lecture Info ------------------------------->
  <div class="inputs">
    <label><input type="date" id="attDate" value="25/09/2025" placeholder="date"></label>
    <label>
      <select id="attSubject">
        <option value="">Select Subject</option>
        <option value="Mathematics">Mathematics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Mechanical">Mechanical</option>
        <option value="English">English</option>
        <option value="Communication skill">Communication Skills</option>
        <option value="Design thinking">Design thinking</option>
      </select>
    </label>
    <!----------------------- input box for Time -------------------------------->
    <label><input type="text" id="attTime" placeholder="e.g. 10:00 AM - 11:00 AM"></label>
  </div>

  <!----------------------------- Roll Number Grid --------------------------->
  <div class="grid" id="rollGrid"></div>
  <p id="countDisplay"></p>

  <!------------------------- Export Buttons ------------------------------->
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="exportPDF()">Export PDF</button>

  <!------------------ a conformanation pop up  ---------------------->
  <div id="toast"</div>

    <!-------------------- script file -------------------->
    <script src="index.js"></script>
</body>
</html>
